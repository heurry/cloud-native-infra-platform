server:
  host: 127.0.0.1
  port: 8088

storage:
  sqlite_path: runs/app/customer_support.db

cors:
  allow_origins:
    - http://127.0.0.1:5173
    - http://localhost:5173

rag:
  top_k: 4
  max_context_chars: 6000
  index_type: sqlite_lexical_v1

chat:
  default_endpoint: auto-router
  fallback_endpoint: aibrix-gateway
  default_max_tokens: 256
  temperature: 0.0
  request_timeout_seconds: 300
