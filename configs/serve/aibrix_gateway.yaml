gateway:
  endpoint_label: aibrix
  base_url: http://127.0.0.1:8010/v1
  model: qwen3-4b-customer
  tokenizer_path: model/Qwen3.5-4B
  request_headers:
    routing-strategy: least-request
    user: ""
  target_pod_headers:
    - target-pod
    - x-target-pod
    - x-aibrix-target-pod
    - x-envoy-upstream-host
benchmark:
  concurrency_levels: [1, 2, 4, 8, 16]
  requests_per_level: 32
  prompt_profile: mixed
  max_tokens: 256
  output_json: runs/serve/aibrix_gateway_benchmark.json
  output_report: runs/serve/aibrix_gateway_benchmark.md
comparison:
  baseline_endpoint_label: vllm-direct
  baseline_base_url: http://127.0.0.1:8000/v1
  compare_metrics:
    - qps
    - mean_ttft_seconds
    - p95_latency_seconds
    - p99_latency_seconds
    - mean_decode_tokens_per_second
    - error_rate
