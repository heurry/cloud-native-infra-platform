# D3：web 容器 nginx 配置（作为 /etc/nginx/templates/default.conf.template，启动时 envsubst）。
# 提供 SPA 静态资源 + 反代 /api 到 go 控制面（同源 → 前端 VITE_API_BASE 留空即可）。
# 只替换 ${GO_SERVER_UPSTREAM}（见 Dockerfile 的 NGINX_ENVSUBST_FILTER），保留 nginx 自身 $vars。
server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    location /api/ {
        proxy_pass http://${GO_SERVER_UPSTREAM};
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_buffering off;        # SSE（chat:stream / 诊断流）逐块下发，禁用缓冲
        proxy_read_timeout 3600s;
    }

    # SPA 路由回退：未知路径交给 index.html，由前端 react-router 处理。
    location / {
        try_files $uri $uri/ /index.html;
    }
}
