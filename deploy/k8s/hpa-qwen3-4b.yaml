# Phase 5 / 5B.3：qwen3-4b-customer 的 HorizontalPodAutoscaler。
# 控制面经 client-go 读回真实 autoscaling 状态（min/max/当前/期望副本 + 目标阈值）。
# 注：live CPU% 需 metrics-server + Pod 声明 CPU requests；本地无 metrics-server 时
# HPA 对象与副本数仍真实，CurrentMetrics 显示 <unknown>（如实展示，不伪造）。
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: qwen3-4b-customer
  namespace: default
  labels:
    app.kubernetes.io/managed-by: cloudnative-infra-platform
    app.kubernetes.io/part-of: ai-serving
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: qwen3-4b-customer
  minReplicas: 2
  maxReplicas: 5
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
  behavior:
    scaleDown:
      stabilizationWindowSeconds: 300
    scaleUp:
      stabilizationWindowSeconds: 60
