apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "cip.serviceAccountName" . }}
  labels:
    {{- include "cip.labels" . | nindent 4 }}
{{- if .Values.rbac.create }}
---
# go-server in-cluster client-go 只读集群级资源（5B.1/5B.3）。
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ include "cip.fullname" . }}-go-server-reader
  labels:
    {{- include "cip.labels" . | nindent 4 }}
rules:
  - apiGroups: [""]
    resources: ["pods", "events", "nodes"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["apps"]
    resources: ["deployments"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["autoscaling"]
    resources: ["horizontalpodautoscalers"]
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: {{ include "cip.fullname" . }}-go-server-reader
  labels:
    {{- include "cip.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: {{ include "cip.fullname" . }}-go-server-reader
subjects:
  - kind: ServiceAccount
    name: {{ include "cip.serviceAccountName" . }}
    namespace: {{ .Release.Namespace }}
{{- end }}
