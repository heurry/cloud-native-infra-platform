{{- if .Values.agent.enabled }}
# 节点采集 Agent（host/gpu）：DaemonSet 每节点一份。集群级 k8s 已由 go-server 直读（5B.1）。
apiVersion: v1
kind: Service
metadata:
  name: {{ include "cip.fullname" . }}-agent
  labels:
    {{- include "cip.labels" . | nindent 4 }}
spec:
  ports:
    - port: {{ .Values.agent.service.port }}
      targetPort: 8090
  selector:
    {{- include "cip.selectorLabels" (dict "root" . "component" "agent") | nindent 4 }}
---
apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: {{ include "cip.fullname" . }}-agent
  labels:
    {{- include "cip.labels" . | nindent 4 }}
spec:
  selector:
    matchLabels:
      {{- include "cip.selectorLabels" (dict "root" . "component" "agent") | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "cip.selectorLabels" (dict "root" . "component" "agent") | nindent 8 }}
    spec:
      hostNetwork: {{ .Values.agent.hostNetwork }}
      containers:
        - name: agent
          image: "{{ .Values.agent.image.repository }}:{{ .Values.agent.image.tag }}"
          imagePullPolicy: {{ .Values.imagePullPolicy }}
          env:
            - name: AGENT_PORT
              value: "8090"
            # 集群级 k8s 已上提到控制面（5B.1），Agent 只做节点采集。
            - name: AGENT_K8S_ENABLED
              value: "false"
          ports:
            - containerPort: 8090
{{- end }}
