# 云原生 AI 设施平台 — 本地一键编排（Go-primary）
#
# 拓扑：前端 → go-server(:8081 单一入口) ──┬─ 原生 ops（PostgreSQL + Redis + MinIO）
#                                          ├─ /api/ai/* → python-ai-service(:8200，诊断/chat/embed)
#                                          ├─ k8s（pods/deployments/events/nodes）→ client-go 直读集群（5B.1）
#                                          └─ host/gpu 节点采集 → go-agent(:8090, host 网络)
#
# 用法（在仓库根目录）：
#   docker compose -f deploy/compose/docker-compose.yml up -d --build
#   docker compose -f deploy/compose/docker-compose.yml logs -f go-server
#   docker compose -f deploy/compose/docker-compose.yml down
#
# Java backend 与 legacy Python 单体（src/api）均已退役（6A 全量绞杀为 Go 原生 + ai-service，6B 删除单体）。
# 全部 /api 端点由 go-server 原生提供（或经 ai-service）；不再有 legacy 反向代理。

name: cloudnative-infra-platform

services:
  postgres:
    # 5B.4c：pgvector/pgvector:pg16（带 vector 扩展）；migration 000006 建 vector 列/索引需要它。
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_DB: infra_platform
      POSTGRES_USER: infra
      POSTGRES_PASSWORD: infra
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U infra -d infra_platform"]
      interval: 5s
      timeout: 5s
      retries: 10

  # 5B.4a：Redis 横切（缓存 / 限流 / 幂等）。缓存型，无需持久化卷；不可达时 go-server 全降级。
  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  # 5B.4b：对象存储（S3 兼容）。基准报告/评测产物/知识源文件；DB 只存 *_uri。
  # go-server 启动时 best-effort 建桶，不可达即降级。
  minio:
    image: minio/minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - miniodata:/data

  go-server:
    build:
      context: ../../server
      dockerfile: Dockerfile
    environment:
      DATABASE_URL: postgres://infra:infra@postgres:5432/infra_platform?sslmode=disable
      SERVER_ADDR: ":8081"
      CORS_ALLOWED_ORIGINS: http://localhost:5173,http://127.0.0.1:5173
      # go-agent 用 host 网络（需连 minikube IP），故经宿主回环访问。
      AGENT_BASE_URL: http://host.docker.internal:8090
      # 5B.1：控制面 client-go 直读集群（kubeconfig 内嵌证书；server 指向 minikube API）。
      KUBECONFIG: /etc/kubeconfig
      # Kubernetes 写能力默认关闭；本地 E2E 可显式
      # ALLOW_K8S_WRITES=true K8S_WRITE_NAMESPACES=default 启用受限写入。
      ALLOW_K8S_WRITES: ${ALLOW_K8S_WRITES:-false}
      K8S_WRITE_NAMESPACES: ${K8S_WRITE_NAMESPACES:-default}
      # 本地实验环境显式启用 PyTorchJob；仍只允许 training 命名空间。
      ALLOW_TRAINING: "true"
      TRAINING_NAMESPACES: training
      TRAINING_HOST_PATH: /opt/twinforge
      TRAINING_MOUNT_PATH: /opt/twinforge
      TRAINING_ARTIFACT_SECRET: training-artifacts
      TRAINING_OUTPUT_ROOT: /opt/twinforge/artifacts/training
      # 新 AI 服务（结构化诊断 / chat:stream / embed）在同一 compose 网络内。
      AI_SERVICE_BASE_URL: http://python-ai-service:8200
      # GitHub Actions 控制台集成；未配置 token 时 API 会明确返回 configured=false。
      GITHUB_REPOSITORY: ${GITHUB_REPOSITORY:-}
      GITHUB_TOKEN: ${GITHUB_TOKEN:-}
      GITHUB_WORKFLOW_FILE: ${GITHUB_WORKFLOW_FILE:-ci.yml}
      # cAdvisor 由 scripts/start_cadvisor_observability.sh 在宿主 18080 做 port-forward。
      CADVISOR_URL: http://host.docker.internal:18080/metrics
      # 5B.4a：Redis 横切（缓存 / 限流 / 幂等）；空则全降级。
      REDIS_URL: redis://redis:6379
      # 5B.4b：对象存储（compose 网络内 MinIO）；空则降级。
      S3_ENDPOINT: minio:9000
      S3_ACCESS_KEY: minioadmin
      S3_SECRET_KEY: minioadmin
      S3_BUCKET: infra-artifacts
      # Serving benchmark 使用仓库内固定清洗切片，避免容器回退到内置短 prompt。
      BENCHMARK_DATASET_PATH: /datasets/dianjin_csc_benchmark.jsonl
      # D1：全链路 trace 导出。默认空=关（/metrics 始终开）；启用方式见下方 observability profile。
      OTEL_EXPORTER_OTLP_ENDPOINT: ${OTEL_EXPORTER_OTLP_ENDPOINT:-}
      OTEL_EXPORTER_OTLP_INSECURE: "true"
      OTEL_SERVICE_NAME: go-control-plane
    ports:
      - "8081:8081"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      # 内嵌证书的 kubeconfig（server: https://192.168.49.2:8443）；供控制面 client-go 直读。
      - ./.secrets/kubeconfig:/etc/kubeconfig:ro
      - ../../data/cleaned/dianjin_csc_benchmark.jsonl:/datasets/dianjin_csc_benchmark.jsonl:ro
    networks:
      - default
      # 接入 minikube 外部网络，使容器可达集群 API（192.168.49.2:8443）。
      - minikube
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_started
    # 运行期为 distroless/static（无 shell），故不配 wget 健康检查；以 depends_on 控制顺序。

  python-ai-service:
    build:
      context: ../../apps/ai-service
      dockerfile: Dockerfile
    environment:
      # 默认 auto：试 live，失败回退 stub。无 GPU 环境可设 AI_STUB_MODE=on 强制确定性 stub。
      AI_STUB_MODE: ${AI_STUB_MODE:-auto}
      AI_LLM_BASE_URL: http://host.docker.internal:8010/v1
      AI_LLM_MODEL: qwen3-4b-customer
      # D1：延续 Go 控制面的 traceparent 并向 vLLM 继续传播（默认空=关）。
      OTEL_EXPORTER_OTLP_ENDPOINT: ${OTEL_EXPORTER_OTLP_ENDPOINT:-}
      OTEL_SERVICE_NAME: ai-service
    ports:
      - "8200:8200"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://localhost:8200/internal/health').status==200 else 1)\""]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 15s

  go-agent:
    build:
      context: ../../agent
      dockerfile: Dockerfile
    # host 网络：直连 minikube API server（192.168.49.2:8443）。
    network_mode: host
    # GPU 透传：宿主已装 nvidia-container-toolkit（runtime=nvidia）。
    # 无 GPU 环境时可删除此段，gpu.go 会优雅降级（available=false）。
    runtime: nvidia
    environment:
      AGENT_PORT: "8090"
      # 5B.1：集群级 k8s 直读已上提到控制面；Agent 退成纯节点采集（host/gpu），关闭 k8s。
      AGENT_K8S_ENABLED: "false"
      NVIDIA_VISIBLE_DEVICES: all
      NVIDIA_DRIVER_CAPABILITIES: utility
      LD_LIBRARY_PATH: /nvidia/lib:/usr/local/nvidia/lib:/usr/local/nvidia/lib64
      # 固定白名单 vLLM workload 的生命周期控制；不接受任意镜像、路径或命令。
      INFERENCE_CONTROL_ENABLED: "true"
      INFERENCE_VLLM_IMAGE: local/vllm-openai:qwen35-v0.19.1
      INFERENCE_MODEL_PATH: /mnt/nvme-data/models/LLM_model/Qwen3.6-27B-FP8
      INFERENCE_CACHE_PATH: /mnt/nvme-data/LLM/llm_train_platform_miniv2/.cache/vllm/qwen36-27b-fp8
      INFERENCE_CONTAINER_NAME: twinforge-vllm-qwen36
    volumes:
      # Docker GPU runtime 异常时的本地兜底：让 Agent 可直接调用宿主 nvidia-smi/NVML。
      - /usr/bin/nvidia-smi:/host/usr/bin/nvidia-smi:ro
      - /usr/lib/x86_64-linux-gnu/libnvidia-ml.so.1:/nvidia/lib/libnvidia-ml.so.1:ro
      # Node Agent 通过 Docker Engine API 管理固定推理 workload。
      - /var/run/docker.sock:/var/run/docker.sock
    privileged: true

  # ===== D1：全链路可观测栈（profile=observability，按需启用，不影响默认 up）=====
  # 启用：
  #   export OTEL_EXPORTER_OTLP_ENDPOINT=http://tempo:4318
  #   docker compose -f deploy/compose/docker-compose.yml --profile observability up -d
  # 然后开 Grafana http://localhost:3000（admin/admin）→ Control Plane 看板 / Explore→Tempo 看 trace 瀑布。
  tempo:
    image: grafana/tempo:2.6.1
    profiles: ["observability"]
    command: ["-config.file=/etc/tempo.yaml"]
    volumes:
      - ./observability/tempo.yaml:/etc/tempo.yaml:ro
      - tempodata:/var/tempo
    ports:
      - "3200:3200" # Tempo API（Grafana 数据源）
      - "4318:4318" # OTLP/HTTP 接收（go-server / ai-service 导出至此）

  prometheus:
    image: prom/prometheus:v2.54.1
    profiles: ["observability"]
    volumes:
      - ./observability/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    ports:
      - "9090:9090"

  grafana:
    image: grafana/grafana:11.2.2
    profiles: ["observability"]
    environment:
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Admin
      GF_SECURITY_ADMIN_PASSWORD: admin
    volumes:
      - ./observability/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./observability/grafana/dashboards:/var/lib/grafana/dashboards:ro
    ports:
      - "3000:3000"
    depends_on:
      - prometheus
      - tempo

networks:
  default:
  # minikube 创建的外部网络；go-server 接入它以直达集群 API。
  # 若用其它集群（kind/k3s/云），改为对应网络或删除此段并让 KUBECONFIG 指向可达地址。
  minikube:
    external: true

volumes:
  pgdata:
  miniodata:
  tempodata:
