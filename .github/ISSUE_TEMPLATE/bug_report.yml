name: Bug report
description: Report a problem so we can fix it
title: "[Bug]: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to file a bug report. Please fill in as much
        of the form below as you can.
        For security issues do **not** use this form — see SECURITY.md.
  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: A clear and concise description of the bug.
      placeholder: When I ... the platform did ...
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
      description: What did you expect to happen instead?
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: Minimal steps to trigger the bug.
      placeholder: |
        1. Start the stack with ...
        2. Open page ...
        3. See error ...
    validations:
      required: true
  - type: dropdown
    id: component
    attributes:
      label: Affected component
      options:
        - server (Go control plane)
        - agent (Go collector)
        - apps/web (frontend)
        - apps/ai-service (Python AI service)
        - src (legacy Python)
        - deploy / infra
        - docs
        - not sure
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: OS, Go/Node/Python versions, Docker, minikube/GPU if relevant.
      placeholder: |
        OS: Ubuntu 22.04
        Go: 1.22.x  Node: 20.x  Python: 3.11
    validations:
      required: false
  - type: textarea
    id: logs
    attributes:
      label: Relevant logs / screenshots
      description: Paste any relevant log output (will be formatted automatically).
      render: shell
    validations:
      required: false
