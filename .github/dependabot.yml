version: 2

# Strategy: monthly cadence, minor/patch updates grouped into a single PR per
# ecosystem to keep noise low. Major version bumps are ignored here and handled
# manually (they usually need code changes + testing).
updates:
  # Go control plane
  - package-ecosystem: gomod
    directory: /server
    schedule:
      interval: monthly
    open-pull-requests-limit: 5
    labels: ["dependencies", "go"]
    groups:
      server-minor-patch:
        patterns: ["*"]
        update-types: ["minor", "patch"]
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]

  # Go agent
  - package-ecosystem: gomod
    directory: /agent
    schedule:
      interval: monthly
    open-pull-requests-limit: 5
    labels: ["dependencies", "go"]
    groups:
      agent-minor-patch:
        patterns: ["*"]
        update-types: ["minor", "patch"]
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]

  # Frontend
  - package-ecosystem: npm
    directory: /apps/web
    schedule:
      interval: monthly
    open-pull-requests-limit: 5
    labels: ["dependencies", "frontend"]
    groups:
      web-minor-patch:
        patterns: ["*"]
        update-types: ["minor", "patch"]
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]

  # Python AI service
  - package-ecosystem: pip
    directory: /apps/ai-service
    schedule:
      interval: monthly
    open-pull-requests-limit: 5
    labels: ["dependencies", "python"]
    groups:
      ai-service-minor-patch:
        patterns: ["*"]
        update-types: ["minor", "patch"]
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]

  # Legacy Python (root requirements.txt)
  - package-ecosystem: pip
    directory: /
    schedule:
      interval: monthly
    open-pull-requests-limit: 5
    labels: ["dependencies", "python"]
    groups:
      root-minor-patch:
        patterns: ["*"]
        update-types: ["minor", "patch"]
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]

  # GitHub Actions workflows
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    open-pull-requests-limit: 5
    labels: ["dependencies", "ci"]
    groups:
      actions-all:
        patterns: ["*"]
